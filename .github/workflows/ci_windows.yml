name: Windows CI

on:
  #push:
  #  branches: [ master, main ]
  #pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_TYPE: Release
  VCPKG_DEFAULT_TRIPLET: x64-windows

jobs:
  build:
    runs-on: windows-2022

    steps:
    ######################################################################
    # Checkout
    ######################################################################

    - name: Checkout source
      uses: actions/checkout@v4
      with:
        submodules: recursive

    ######################################################################
    # Toolchain
    ######################################################################

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Setup Ninja
      uses: seanmiddleditch/gha-setup-ninja@v5

    - name: Setup CMake
      uses: lukka/get-cmake@latest

    ######################################################################
    # Qt
    ######################################################################

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: "5.15.2"
        arch: win64_msvc2019_64
        cache: true

    ######################################################################
    # vcpkg
    ######################################################################

    - name: Checkout vcpkg
      uses: actions/checkout@v4
      with:
        repository: microsoft/vcpkg
        path: vcpkg

    - name: Restore vcpkg cache
      uses: actions/cache@v4
      with:
        path: |
          vcpkg/downloads
          vcpkg/packages
          vcpkg/installed
        key: windows-vcpkg-${{ runner.os }}-${{ env.VCPKG_DEFAULT_TRIPLET }}-v1
        restore-keys: |
          windows-vcpkg-

    - name: Bootstrap vcpkg
      shell: powershell
      run: |
        $vcpkgRoot = Join-Path $env:GITHUB_WORKSPACE "vcpkg"

        & "$vcpkgRoot\bootstrap-vcpkg.bat"
        if ($LASTEXITCODE -ne 0) { throw "bootstrap-vcpkg failed." }

        # Use forward slashes to avoid CMake/backslash-escape issues
        $vcpkgRootFs = $vcpkgRoot -replace '\\','/'
        "VCPKG_ROOT=$vcpkgRootFs" >> $env:GITHUB_ENV

    - name: Install dependencies
      shell: powershell
      run: |
        & "$env:VCPKG_ROOT\vcpkg.exe" install `
            curl:x64-windows `
            openssl:x64-windows `
            crossguid:x64-windows

        if ($LASTEXITCODE -ne 0) {
            throw "vcpkg install failed."
        }

    ######################################################################
    # GStreamer
    ######################################################################

    - name: Restore GStreamer cache
      uses: actions/cache@v4
      with:
        path: |
          gst-runtime.msi
          gst-devel.msi
        key: gst-1.24.13-msvc

    - name: Download GStreamer
      shell: powershell
      run: |
        if (!(Test-Path "gst-runtime.msi"))
        {
            Invoke-WebRequest `
              "https://gstreamer.freedesktop.org/data/pkg/windows/1.24.13/msvc/gstreamer-1.0-msvc-x86_64-1.24.13.msi" `
              -OutFile "gst-runtime.msi"
        }
        if (!(Test-Path "gst-devel.msi"))
        {
            Invoke-WebRequest `
              "https://gstreamer.freedesktop.org/data/pkg/windows/1.24.13/msvc/gstreamer-1.0-devel-msvc-x86_64-1.24.13.msi" `
              -OutFile "gst-devel.msi"
        }

    - name: Install GStreamer
      shell: powershell
      run: |
        $runtime = 'gst-runtime.msi'
        $devel   = 'gst-devel.msi'
        $installDir = 'C:\gstreamer'
        # write logs to known, fixed locations so the later verification step can find them
        $runtimeLog = 'C:\gstreamer_install_runtime.log'
        $develLog   = 'C:\gstreamer_install_devel.log'

        Write-Host "Installing GStreamer to $installDir"

        # Ensure MSI files are present
        if (-not (Test-Path $runtime)) {
          throw "Runtime MSI not found: $runtime"
        }
        if (-not (Test-Path $devel)) {
          throw "Devel MSI not found: $devel"
        }

        # Helper to run msiexec with proper arguments and capture exit code
        function Run-MsiInstall($msiPath, $logPath) {
          $args = @(
            "/i",
            (Resolve-Path $msiPath).Path,
            "/qn",
            "INSTALLDIR=$installDir",
            "/l*v",
            $logPath,
            "/norestart"
          )
          Write-Host "Running: msiexec.exe $($args -join ' ')"
          $proc = Start-Process -FilePath msiexec.exe -ArgumentList $args -Wait -NoNewWindow -PassThru
          return $proc.ExitCode
        }

        # Install runtime
        $rc = Run-MsiInstall $runtime $runtimeLog
        if ($rc -ne 0 -and $rc -ne 3010) {
        Write-Host "GStreamer runtime installer failed with exit code $rc. Tail of log:"
        if (Test-Path $runtimeLog) { Get-Content $runtimeLog -Tail 200 | ForEach-Object { Write-Host $_ } } else { Write-Host "Log not found: $runtimeLog" }
        exit $rc
        }

        # Install devel
        $rc = Run-MsiInstall $devel $develLog
        if ($rc -ne 0 -and $rc -ne 3010) {
        Write-Host "GStreamer devel installer failed with exit code $rc. Tail of log:"
        if (Test-Path $develLog) { Get-Content $develLog -Tail 200 | ForEach-Object { Write-Host $_ } } else { Write-Host "Log not found: $develLog" }
        exit $rc
        }

    - name: Export GStreamer variables and verify install
      shell: powershell
      run: |
        # Export using forward slashes to prevent backslash escape sequences in CMake files
        Add-Content -Path $env:GITHUB_ENV -Value 'GSTREAMER_1_0_ROOT_MSVC_X86_64=C:/gstreamer/1.0/msvc_x86_64'
        Add-Content -Path $env:GITHUB_ENV -Value 'GSTREAMER_1_0_ROOT_X86_64=C:/gstreamer'
        Add-Content -Path $env:GITHUB_ENV -Value 'GSTREAMER_ROOT=C:/gstreamer'

        # Add bin to PATH with forward slashes (works fine on Windows)
        Add-Content -Path $env:GITHUB_PATH -Value 'C:/gstreamer/bin'

        # Quick verification of installed contents (fail with helpful message if missing)
        Write-Host "Listing top-level C:\gstreamer contents..."
        if (Test-Path 'C:\gstreamer') {
          Get-ChildItem -Path 'C:\gstreamer' -Force | ForEach-Object { Write-Host $_.FullName }
        } else {
          Write-Host "ERROR: C:\gstreamer directory not present (installer may have failed)."
          if (Test-Path 'C:\gstreamer_install_runtime.log') {
            Write-Host "==== GStreamer runtime install log (tail) ===="
            Get-Content C:\gstreamer_install_runtime.log -Tail 200 | ForEach-Object { Write-Host $_ }
            Write-Host "==== end install log ===="
          }
          if (Test-Path 'C:\gstreamer_install_devel.log') {
            Write-Host "==== GStreamer devel install log (tail) ===="
            Get-Content C:\gstreamer_install_devel.log -Tail 200 | ForEach-Object { Write-Host $_ }
            Write-Host "==== end install log ===="
          }
          exit 1
        }

        # Improved diagnostics: if the expected gstreamer-1.0 subfolder isn't present, dump more info
        $headerPath = 'C:\gstreamer\1.0\msvc_x86_64\include\gstreamer-1.0'
        if (-not (Test-Path $headerPath)) {
          Write-Host "WARNING: Expected GStreamer header folder not found: $headerPath"
          Write-Host "Showing first-level contents of C:\gstreamer:"
          Get-ChildItem -Recurse -Path 'C:\gstreamer' -Depth 2 | ForEach-Object { Write-Host $_.FullName }
          Write-Host "Showing full contents of C:\gstreamer\1.0\msvc_x86_64 (depth 4):"
          Get-ChildItem -Recurse -Path 'C:\gstreamer\1.0\msvc_x86_64' -Depth 4 | ForEach-Object { Write-Host $_.FullName }

          if (Test-Path 'C:\gstreamer_install_devel.log') {
            Write-Host "==== GStreamer devel install log (tail) ===="
            Get-Content C:\gstreamer_install_devel.log -Tail 500 | ForEach-Object { Write-Host $_ }
            Write-Host "==== end install log ===="
          }

          # Fail so logs are visible for debugging; once layout is confirmed, we can remove or relax this.
          exit 1
        }

        if (-not (Test-Path 'C:\gstreamer\1.0\msvc_x86_64\lib')) {
          Write-Host "ERROR: GStreamer libs not found under C:\gstreamer\1.0\msvc_x86_64\lib"
          exit 1
        }

    ######################################################################
    # Configure
    ######################################################################

    - name: Configure
      shell: powershell
      env:
        VCPKG_ROOT: ${{ env.VCPKG_ROOT }}
        BUILD_TYPE: ${{ env.BUILD_TYPE }}
      run: |
        $vcpkgToolchain = "$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake"
        # Use forward slashes for GStreamer paths to avoid backslash escape issues in generated CMake scripts
        $gstreamer_root = 'C:/gstreamer/1.0/msvc_x86_64'
        cmake `
          -S . `
          -B build `
          -G Ninja `
          -DCMAKE_BUILD_TYPE="$env:BUILD_TYPE" `
          -DCMAKE_TOOLCHAIN_FILE="$vcpkgToolchain" `
          -DGSTREAMER_1_0_ROOT_MSVC_X86_64="$gstreamer_root" `
          -DCMAKE_PREFIX_PATH="$gstreamer_root"

    ######################################################################
    # Build
    ######################################################################

    - name: Build
      shell: powershell
      run: |
        # Build the main target explicitly to ensure the exe is produced
        cmake --build build --config $env:BUILD_TYPE --target webrtc-ui --parallel

        # If the exe isn't present, list build output for debugging
        $exeRel = "build/$($env:BUILD_TYPE)/webrtc-ui.exe"
        if (-not (Test-Path $exeRel)) {
          Write-Host "WARNING: built exe not found at $exeRel"
          Write-Host "Listing build/$($env:BUILD_TYPE):"
          Get-ChildItem -Path "build/$($env:BUILD_TYPE)" -Recurse -Force | ForEach-Object { Write-Host $_.FullName }
        }

    - name: Install
      shell: powershell
      run: |
        # use an absolute prefix (forward slashes) to avoid backslash escape errors
        $installPrefix = "${{ github.workspace }}/install"
        $installPrefix = $installPrefix -replace '\\','/'   # ensure forward slashes
        # verify the main target is built (adjust target name if different)
        $exePath = "build/$($env:BUILD_TYPE)/webrtc-ui.exe"
        if (-not (Test-Path $exePath)) {
          Write-Host "WARNING: built exe not found at $exePath - attempting install anyway to surface CMake errors"
          Write-Host "Listing build directory:"
          Get-ChildItem -Path "build" -Recurse -Force | ForEach-Object { Write-Host $_.FullName }
        }
        cmake --install build --config $env:BUILD_TYPE --prefix $installPrefix

    ######################################################################
    # Package
    ######################################################################

    - name: Archive
      shell: powershell
      run: |
        if (!(Test-Path "install"))
        {
            throw "Install directory not found."
        }

        Compress-Archive `
            -Path "install\*" `
            -DestinationPath "webrtc-ui-windows.zip" `
            -Force

    ######################################################################
    # Upload
    ######################################################################

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: webrtc-ui-windows
        path: webrtc-ui-windows.zip
