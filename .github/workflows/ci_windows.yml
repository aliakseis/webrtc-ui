name: Windows CI

on:
  #push:
  #  branches: [ master, main ]
  #pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_TYPE: Release
  VCPKG_DEFAULT_TRIPLET: x64-windows

jobs:
  build:
    runs-on: windows-2022

    steps:
    ######################################################################
    # Checkout
    ######################################################################

    - name: Checkout source
      uses: actions/checkout@v4
      with:
        submodules: recursive

    ######################################################################
    # Toolchain
    ######################################################################

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Setup Ninja
      uses: seanmiddleditch/gha-setup-ninja@v5

    - name: Setup CMake
      uses: lukka/get-cmake@latest

    ######################################################################
    # Qt
    ######################################################################

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: "5.15.2"
        arch: win64_msvc2019_64
        cache: true

    ######################################################################
    # vcpkg
    ######################################################################

    - name: Checkout vcpkg
      uses: actions/checkout@v4
      with:
        repository: microsoft/vcpkg
        path: vcpkg

    - name: Restore vcpkg cache
      uses: actions/cache@v4
      with:
        path: |
          vcpkg/downloads
          vcpkg/packages
          vcpkg/installed
        key: windows-vcpkg-${{ runner.os }}-${{ env.VCPKG_DEFAULT_TRIPLET }}-v1
        restore-keys: |
          windows-vcpkg-

    - name: Bootstrap vcpkg
      shell: powershell
      run: |
        $vcpkgRoot = Join-Path $env:GITHUB_WORKSPACE "vcpkg"

        & "$vcpkgRoot\bootstrap-vcpkg.bat"

        if ($LASTEXITCODE -ne 0) {
            throw "bootstrap-vcpkg failed."
        }

        "VCPKG_ROOT=$vcpkgRoot" >> $env:GITHUB_ENV

    - name: Install dependencies
      shell: powershell
      run: |
        & "$env:VCPKG_ROOT\vcpkg.exe" install `
            curl:x64-windows `
            openssl:x64-windows `
            crossguid:x64-windows

        if ($LASTEXITCODE -ne 0) {
            throw "vcpkg install failed."
        }

    ######################################################################
    # GStreamer
    ######################################################################

    - name: Restore GStreamer cache
      uses: actions/cache@v4
      with:
        path: gst.msi
        key: gst-1.24.13-msvc

    - name: Download GStreamer
      shell: powershell
      run: |
        if (!(Test-Path "gst.msi"))
        {
            Invoke-WebRequest `
              "https://gstreamer.freedesktop.org/data/pkg/windows/1.24.13/msvc/gstreamer-1.0-msvc-x86_64-1.24.13.msi" `
              -OutFile "gst.msi"
        }

    - name: Install GStreamer
      shell: powershell
      run: |
        Start-Process msiexec `
            -ArgumentList '/i gst.msi /qn INSTALLDIR=C:\gstreamer' `
            -Wait

    - name: Export GStreamer variables
      shell: powershell
      run: |
        "GSTREAMER_1_0_ROOT_MSVC_X86_64=C:\gstreamer" >> $env:GITHUB_ENV
        "PATH=C:\gstreamer\bin;$env:PATH" >> $env:GITHUB_ENV

    ######################################################################
    # Configure
    ######################################################################

    - name: Configure
      shell: powershell
      run: |
        cmake `
          -S . `
          -B build `
          -G Ninja `
          -DCMAKE_BUILD_TYPE=$env:BUILD_TYPE `
          "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake"

    ######################################################################
    # Build
    ######################################################################

    - name: Build
      shell: powershell
      run: |
        cmake --build build --parallel

    ######################################################################
    # Install
    ######################################################################

    - name: Install
      shell: powershell
      run: |
        cmake --install build --prefix install

    ######################################################################
    # Package
    ######################################################################

    - name: Archive
      shell: powershell
      run: |
        if (!(Test-Path "install"))
        {
            throw "Install directory not found."
        }

        Compress-Archive `
            -Path "install\*" `
            -DestinationPath "webrtc-ui-windows.zip" `
            -Force

    ######################################################################
    # Upload
    ######################################################################

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: webrtc-ui-windows
        path: webrtc-ui-windows.zip
