name: Windows CI

on:
  #push:
  #  branches: [ master, main ]
  #pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_TYPE: Release
  VCPKG_ROOT: ${{ github.workspace }}\vcpkg
  VCPKG_DEFAULT_TRIPLET: x64-windows

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Setup Ninja
      uses: seanmiddleditch/gha-setup-ninja@v5

    - name: Setup CMake
      uses: lukka/get-cmake@latest

    ######################################################################
    # Qt
    ######################################################################

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: "5.15.2"
        arch: win64_msvc2019_64
        cache: true

    ######################################################################
    # vcpkg
    ######################################################################

    - name: Checkout vcpkg
      uses: actions/checkout@v4
      with:
        repository: microsoft/vcpkg
        path: vcpkg
        fetch-depth: 0

    - name: Restore vcpkg cache
      uses: actions/cache@v4
      with:
        path: |
          vcpkg/installed
          vcpkg/packages
          vcpkg/downloads
        key: >
          windows-vcpkg-${{ hashFiles('**/vcpkg.json') }}
        restore-keys: |
          windows-vcpkg-

    - name: Bootstrap vcpkg
      shell: powershell
      run: |
        $vcpkgRoot = Join-Path $env:GITHUB_WORKSPACE 'vcpkg'
        $bootstrap = Join-Path $vcpkgRoot 'bootstrap-vcpkg.bat'

        if (-not (Test-Path $bootstrap)) {
          Write-Host "ERROR: bootstrap-vcpkg.bat not found at: $bootstrap"
          Write-Host "GITHUB_WORKSPACE: $env:GITHUB_WORKSPACE"
          Write-Host "Listing workspace root:"
          Get-ChildItem -Force $env:GITHUB_WORKSPACE
          Write-Host "Listing $vcpkgRoot (if present):"
          Get-ChildItem -Force $vcpkgRoot -ErrorAction SilentlyContinue
          exit 1
        }

        Write-Host "Bootstrapping vcpkg from: $bootstrap"
        & $bootstrap

    - name: Install dependencies
      shell: powershell
      run: |
        & "$env:VCPKG_ROOT\vcpkg.exe" install `
          curl:x64-windows `
          openssl:x64-windows `
          crossguid:x64-windows

    ######################################################################
    # GStreamer
    ######################################################################

    - name: Cache GStreamer installer
      uses: actions/cache@v4
      with:
        path: gst.msi
        key: gst-1.24.13-msvc

    - name: Download GStreamer
      if: ${{ !hashFiles('gst.msi') }}
      shell: powershell
      run: |
        Invoke-WebRequest `
          "https://gstreamer.freedesktop.org/data/pkg/windows/1.24.13/msvc/gstreamer-1.0-msvc-x86_64-1.24.13.msi" `
          -OutFile gst.msi

    - name: Install GStreamer
      shell: powershell
      run: |
        Start-Process msiexec `
          -ArgumentList "/i gst.msi /qn INSTALLDIR=C:\gstreamer" `
          -Wait

    - name: Export GStreamer variables
      shell: powershell
      run: |
        "GSTREAMER_1_0_ROOT_MSVC_X86_64=C:\gstreamer" >> $env:GITHUB_ENV
        "PATH=C:\gstreamer\bin;$env:PATH" >> $env:GITHUB_ENV

    ######################################################################
    # Configure
    ######################################################################

    - name: Configure
      shell: cmd
      run: |
        cmake ^
          -S . ^
          -B build ^
          -G Ninja ^
          -DCMAKE_BUILD_TYPE=%BUILD_TYPE% ^
          -DCMAKE_TOOLCHAIN_FILE=%VCPKG_ROOT%\scripts\buildsystems\vcpkg.cmake

    ######################################################################
    # Build
    ######################################################################

    - name: Build
      shell: cmd
      run: |
        cmake --build build --config %BUILD_TYPE% --parallel

    ######################################################################
    # Install
    ######################################################################

    - name: Install
      shell: cmd
      run: |
        cmake --install build --config %BUILD_TYPE% --prefix install

    ######################################################################
    # Package
    ######################################################################

    - name: Archive
      shell: powershell
      run: |
        Compress-Archive `
          -Path install\* `
          -DestinationPath webrtc-ui-windows.zip `
          -Force

    ######################################################################
    # Upload
    ######################################################################

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: webrtc-ui-windows
        path: webrtc-ui-windows.zip
